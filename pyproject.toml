[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynasty_sim"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["numpy", "numba", "pandas", "pyarrow", "pyyaml", "scipy"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]

[tool.setuptools.packages.find]
include = ["dynasty_sim*"]

[tool.setuptools.package-data]
dynasty_sim = ["config/*.yaml", "output/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running statistical tests", "acceptance: the M8 acceptance suite, tests (a)-(e)"]
