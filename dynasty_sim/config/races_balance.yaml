# Balance overlay on config/races.yaml: additive shifts to a race's trait MEANS (native units).
# races.yaml keeps the spec's table; this file records every deliberate departure from it and why.
#
# elf.height -11 (189 -> 178): with the spec's 189 cm mean, Elf pros (top of their own race) average ~200 cm, ~9 cm taller
# than Human pros. Tall shooters get more rim value in the engine (higher release, defenders cannot contest), so Elf
# teams shoot 21% threes against Humans' 56% and win 85% of head-to-head games. The spec describes Elves as "slightly
# taller, slender" with touch/quickness as their edge; at 178 cm the engine reproduces that (more threes, fewer
# turnovers, fewer rebounds) and Elf teams are near parity with Human teams.
#
# elf.touch +6 (62 -> 68): shortening Elves removes their rim edge, so their shooting edge is what makes them a distinct
# style. With touch 62 the Elf share of a roster barely moved its three-point rate (regression on team ancestry: +0.00,
# interval spanning zero); with 68 it is +0.04 and turnovers fall, which is the style the spec describes. 68 is +1.3
# Human SDs; the spec's under-one-SD rule for between-race gaps names vision and temperament, not touch.
#
# Development identity (the design brief: Humans are quick studies who arrive early, Elves are slow burners who lead late).
# In the spec table Elves out-learned Humans inside the league: the Human fast-learning window (12-18) closes before a
# Human turns pro at 20, while the Elf window (22-36) covers their whole first decade as pros (they turn pro at 30).
#   human.learning +0.15 and learn_window [19, 26, x2.0]: a steep climb through the first six pro years, then the base rate.
#   elf.learning -0.25 and learn_window [30, 45, x1.4]: a gentler climb that takes about ten years to reach the ceiling.
# wisdom (new): every year lived past adulthood raises the vision and temperament ceiling by this many SD, capped at
# dev.wisdom_cap. Elves live and play for decades, so they gain up to a full SD of court sense; Humans gain a little.
mu_shift:
  human:
    learning: 0.15
  elf:
    height: -11.0
    touch: 6.0
    learning: -0.25

life_history:
  human: {learn_window: [19, 26, 2.0], wisdom: 0.01}
  goliath: {wisdom: 0.0}
  elf: {learn_window: [30, 45, 1.4], wisdom: 0.05}
