# Race order: human, goliath, elf. Trait order matches defaults.yaml.
# Values are (mean, sd) per race, adult, sex-averaged, pre-draft-selection.
races: [human, goliath, elf]

traits:
  height:      {human: [176, 8.0],  goliath: [232, 11],  elf: [189, 6]}
  ape:         {human: [1.00, .035], goliath: [1.06, .03], elf: [1.02, .025]}
  vertical:    {human: [50, 10],    goliath: [38, 7],     elf: [56, 7]}
  agility:     {human: [12.0, .65], goliath: [13.5, .6],  elf: [11.5, .45]}
  endurance:   {human: [50, 11],    goliath: [40, 8],     elf: [58, 8]}
  strength:    {human: [50, 13],    goliath: [82, 10],    elf: [36, 8]}
  hand:        {human: [20.5, 1.3], goliath: [27, 1.5],   elf: [21, 1.0]}
  touch:       {human: [50, 14],    goliath: [36, 9],     elf: [62, 9]}
  vision:      {human: [50, 14],    goliath: [48, 11],    elf: [58, 10]}
  learning:    {human: [1.00, .23], goliath: [0.75, .12], elf: [1.05, .15]}
  injury_res:  {human: [50, 14],    goliath: [42, 10],    elf: [44, 9]}
  temperament: {human: [50, 17],    goliath: [62, 10],    elf: [52, 10]}

# Genetic distance D (Frankham-style), symmetric.
distance:
  human-goliath: 0.55
  human-elf: 0.35
  elf-goliath: 0.75

life_history:
  human:   {base_conception: 0.25, fertile_female: [18, 42], adult_age: 20, lifespan: [72, 12], birth_interval: 2, timescale: 1.0, decline_mult: 1.0, learn_window: [12, 18, 2.0]}
  goliath: {base_conception: 0.20, fertile_female: [20, 40], adult_age: 24, lifespan: [60, 10], birth_interval: 2, timescale: 0.6, decline_mult: 1.3, learn_window: [14, 22, 1.6]}
  elf:     {base_conception: 0.06, fertile_female: [40, 110], adult_age: 30, lifespan: [160, 25], birth_interval: 6, timescale: 2.0, decline_mult: 0.4, learn_window: [22, 36, 2.2]}

# Variant-allele frequency per race for each Mendelian locus.
loci:
  titan:       {human: 0.03, goliath: 0.10, elf: 0.02}
  hawkeye:     {human: 0.04, goliath: 0.02, elf: 0.08}
  brittle:     {human: 0.05, goliath: 0.06, elf: 0.06}
  longwind:    {human: 0.05, goliath: 0.02, elf: 0.10}
  stonehands:  {human: 0.04, goliath: 0.08, elf: 0.02}
  late_bloom:  {human: 0.05, goliath: 0.05, elf: 0.05}
