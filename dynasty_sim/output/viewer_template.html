<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynasty History Viewer</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1f23; --muted: #6a6f78; --line: #dcdad2; --accent: #2f5d8a;
  --gold: #d9a21b; --final: #4f7cac; --playoff: #a9c1da; --out: #e6e4dc; --good: #2d7d4f; --bad: #b24a3a;
  --human: #4f7cac; --goliath: #b5642f; --elf: #3f8f6b; --hyb: #8a63b8; --sel: #fff6d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161a; --panel: #1d2026; --ink: #e6e7ea; --muted: #959ba6; --line: #343944; --accent: #7fb0e4;
    --gold: #e8b73a; --final: #5f8fc2; --playoff: #35506d; --out: #272b33; --good: #5cc08a; --bad: #e0806f;
    --human: #6f9fd0; --goliath: #d98652; --elf: #5fbf93; --hyb: #b393e0; --sel: #3a3318;
  }
}
:root[data-theme="dark"] {
  --bg: #14161a; --panel: #1d2026; --ink: #e6e7ea; --muted: #959ba6; --line: #343944; --accent: #7fb0e4;
  --gold: #e8b73a; --final: #5f8fc2; --playoff: #35506d; --out: #272b33; --good: #5cc08a; --bad: #e0806f;
  --human: #6f9fd0; --goliath: #d98652; --elf: #5fbf93; --hyb: #b393e0; --sel: #3a3318;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
button, select, input { font: inherit; color: inherit; }
button, select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
input[type=text], input[type=number], input[type=search] { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
header { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0; } header .meta { color: var(--muted); font-size: 13px; flex: 1 1 200px; }
header .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
#jobpill { display: none; font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--sel); border: 1px solid var(--gold); }
nav.tabs { display: flex; gap: 2px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
nav.tabs a { padding: 9px 16px; color: var(--muted); border-bottom: 3px solid transparent; font-weight: 600; }
nav.tabs a.on { color: var(--ink); border-bottom-color: var(--accent); text-decoration: none; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 16px; max-width: 1500px; margin: 0 auto; align-items: start; }
@media (max-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
.card h2 { font-size: 14px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.card h3 { font-size: 15px; margin: 0 0 6px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.stat b { display: block; font-size: 20px; } .stat span { color: var(--muted); font-size: 12px; }
table { border-collapse: collapse; width: 100%; } th, td { padding: 4px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 12px; } th:first-child, td:first-child, td.l, th.l { text-align: left; }
tr.hl td { background: var(--sel); } .scroll { overflow-x: auto; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; border: 1px solid var(--line); }
.chip.champ { background: var(--gold); color: #1d1f23; border-color: var(--gold); } .chip.final { background: var(--final); color: #fff; border-color: var(--final); }
.chip.playoff { background: var(--playoff); } .chip.hof { background: var(--gold); color: #1d1f23; border-color: var(--gold); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; } .r0 { background: var(--human); } .r1 { background: var(--goliath); } .r2 { background: var(--elf); }
/* dynasty strip */
.strip { overflow-x: auto; padding-bottom: 6px; } .strip-inner { min-width: 720px; }
.srow { display: flex; align-items: center; margin-bottom: 3px; } .srow.sel .slabel { background: var(--sel); border-radius: 4px; }
.slabel { flex: 0 0 190px; padding: 2px 6px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slabel small { color: var(--muted); }
.cells { flex: 1; display: grid; gap: 1px; } .cells i { display: block; height: 22px; background: var(--out); cursor: pointer; border-radius: 1px; }
.cells i:hover { outline: 2px solid var(--ink); outline-offset: -1px; z-index: 1; }
.res-champ { background: var(--gold) !important; } .res-final { background: var(--final) !important; } .res-playoff { background: var(--playoff) !important; }
.axis { height: 16px; } .axis span { font-size: 11px; color: var(--muted); white-space: nowrap; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 5px; background: var(--out); }
#tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 9px; border-radius: 6px; font-size: 12px; display: none; z-index: 10; max-width: 260px; }
/* seasons */
.seasonbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; } .seasonbar input[type=range] { flex: 1; min-width: 160px; }
.seasonbar .yr { font-size: 20px; font-weight: 700; min-width: 90px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; } .grid2 .card { margin-bottom: 0; }
.awards li { margin: 3px 0; } .awards span.lab { color: var(--muted); display: inline-block; min-width: 128px; }
.round h4 { margin: 8px 0 3px; font-size: 12px; color: var(--muted); text-transform: uppercase; } .round div { padding: 1px 0; }
.win { font-weight: 700; } .lose { color: var(--muted); }
/* players */
.plist { list-style: none; margin: 0; padding: 0; } .plist li { padding: 5px 0; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: baseline; }
.plist .sub { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
.subtabs { display: flex; gap: 6px; margin: 10px 0; } .subtabs button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.bio { color: var(--muted); margin: 2px 0 10px; } .fam { margin: 4px 0; }
.chart { width: 100%; height: auto; } .chart text { fill: var(--muted); font-size: 10px; }
/* feed */
.feed h2 { display: flex; justify-content: space-between; align-items: center; } .feed .filters { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; } .feed select { padding: 3px 6px; font-size: 12px; }
.feed ul { list-style: none; margin: 0; padding: 0; max-height: 78vh; overflow-y: auto; }
.feed li { padding: 6px 0 6px 12px; border-bottom: 1px solid var(--line); border-left: 3px solid var(--line); margin-bottom: 2px; font-size: 13px; }
.feed li.m3 { border-left-color: var(--gold); } .feed li.m2 { border-left-color: var(--final); }
.feed .y { font-weight: 700; margin-right: 4px; } .feed .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; display: block; }
.empty { text-align: center; padding: 70px 20px; max-width: 560px; margin: 40px auto; } .empty h2 { text-transform: none; font-size: 22px; color: var(--ink); }
.empty .row { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
.muted { color: var(--muted); }
dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; width: min(420px, 92vw); }
dialog::backdrop { background: rgba(0,0,0,.45); } dialog label { display: block; margin: 10px 0 3px; font-size: 12px; color: var(--muted); } dialog input, dialog select { width: 100%; }
dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
code, pre { background: var(--out); border-radius: 5px; padding: 1px 5px; font-size: 12.5px; } pre { padding: 8px 10px; overflow-x: auto; }
.bar { height: 8px; background: var(--out); border-radius: 4px; overflow: hidden; margin-top: 10px; } .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.err { color: var(--bad); margin-top: 8px; }

/* charts, heat tables, bars */
.lchart { width: 100%; height: auto; display: block; } .lchart text { fill: var(--muted); font-size: 10px; } .lchart .grid { stroke: var(--line); stroke-width: 1; } .lchart .ref { stroke-dasharray: 4 3; }
.lg { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 4px; } .lg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
.cgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; margin-bottom: 16px; } .cgrid .card { margin-bottom: 0; }
@media (max-width: 480px) { .cgrid { grid-template-columns: minmax(0, 1fr); } }
.heat td { text-align: center; font-variant-numeric: tabular-nums; } .heat td:first-child { text-align: left; }
.stack { display: flex; height: 10px; border-radius: 3px; overflow: hidden; background: var(--out); min-width: 120px; } .stack i { display: block; height: 100%; }
.alarm { padding: 6px 10px; border-left: 3px solid var(--bad); background: var(--out); margin: 4px 0; border-radius: 0 6px 6px 0; font-size: 13px; }
.ok { color: var(--good); font-weight: 700; } .badtxt { color: var(--bad); font-weight: 700; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; } .pills button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
th.sortable { cursor: pointer; } th.sortable:hover { color: var(--ink); }
tr.pick { cursor: pointer; } tr.pick:hover td { background: var(--out); } tr.pick.on td { background: var(--sel); }
.hm td.cell { text-align: center; cursor: pointer; min-width: 44px; } .hm td.cell:hover { outline: 2px solid var(--ink); }
nav.tabs { flex-wrap: wrap; } nav.tabs a { padding: 9px 12px; }
#drop { position: fixed; inset: 0; background: rgba(47,93,138,.25); display: none; align-items: center; justify-content: center; font-size: 24px; z-index: 20; pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>Dynasty History Viewer</h1>
  <div class="meta" id="meta">No run loaded</div>
  <div class="actions">
    <span id="jobpill"></span>
    <select id="saved" title="Saved runs in the runs folder" style="display:none"></select>
    <button id="btn-load">Load run…</button>
    <button id="btn-new" class="primary">New run…</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </div>
</header>
<nav class="tabs" id="tabs">
  <a href="#/dynasty" data-tab="dynasty">Dynasties</a>
  <a href="#/season" data-tab="season">Seasons</a>
  <a href="#/players" data-tab="player">Players</a>
  <a href="#/races" data-tab="races">Races</a>
  <a href="#/records" data-tab="records">Records</a>
  <a href="#/rivalries" data-tab="rivalries">Rivalries</a>
  <a href="#/hof" data-tab="hof">Hall of Fame</a>
  <a href="#/health" data-tab="health">League health</a>
</nav>
<div id="app"></div>
<div id="tip"></div>
<div id="drop">Drop a saved run (viewer.json) to load it</div>

<dialog id="newdlg">
  <h3 style="margin:0">Start a new run</h3>
  <div id="newbody"></div>
</dialog>

<script>
const EMBEDDED = __EMBEDDED_RUN__;

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fy = y => (y < 0 ? `${-y} BF` : String(y));
const fl = (x, d = 1) => (x == null ? "—" : Number(x).toFixed(d));
const push = (m, k, v) => { (m.get(k) || m.set(k, []).get(k)).push(v); };
const RES_LABEL = { champ: "Champion", final: "Finalist", playoff: "Made playoffs", out: "Missed playoffs" };
const IMP = ["minor", "notable", "major", "landmark"];
const RCOL = ["var(--human)", "var(--goliath)", "var(--elf)", "var(--hyb)"];

let D = null, X = null;                     // data and derived indexes
let SERVER = false, jobTimer = null;

/* ---------- loading ---------- */
function init(data) {
  if (!data || data.format !== "dynasty-viewer") throw new Error("That file is not a dynasty viewer run (expected viewer.json).");
  D = data;
  X = { year: new Map(D.years.map(y => [y.y, y])), evYear: new Map(), evPlayer: new Map(), evHouse: new Map(), team: new Map(D.teams.map(t => [t.id, t])) };
  for (const e of D.events) { push(X.evYear, e.y, e); e.a.forEach(a => push(X.evPlayer, a, e)); e.h.forEach(h => push(X.evHouse, h, e)); }
  X.kinds = [...new Set(D.events.map(e => e.k))].sort();
  X.stats = D.teams.map(t => ({ t: t.id, titles: [], finals: 0, playoffs: 0, streak: 0 }));
  for (const yr of D.years) {
    for (const t of D.teams) {
      const r = result(yr, t.id), s = X.stats[t.id];
      if (r === "champ") s.titles.push(yr.y);
      if (r === "champ" || r === "final") s.finals++;
      if (r !== "out") s.playoffs++;
    }
  }
  for (const s of X.stats) { let run = 0, best = 0, prev = null; for (const y of s.titles) { run = prev !== null && y === prev + 1 ? run + 1 : 1; best = Math.max(best, run); prev = y; } s.streak = best; }
  X.players = Object.entries(D.players).filter(([, p]) => p.s).map(([id, p]) => ({ id: +id, p, first: p.s[0][0], last: p.s[p.s.length - 1][0] }));
  X.champYears = new Map(D.years.map(y => [y.y, y.c]));
  const m = D.meta;
  $("#meta").textContent = `Seed ${m.seed} · years ${m.first_year}–${m.last_year} (${m.years} seasons) · ${m.teams} teams · ${m.people.toLocaleString()} people`;
  route();
}
async function loadFile(file) {
  try { init(JSON.parse(await file.text())); } catch (e) { toast(e.message); }
}
function toast(msg) { const a = $("#app"); a.insertAdjacentHTML("afterbegin", `<div class="card err" id="toast">${esc(msg)}</div>`); setTimeout(() => $("#toast")?.remove(), 6000); }

/* ---------- lookups ---------- */
const player = pid => D.players[pid];
const pname = pid => player(pid)?.n ?? "Unknown";
const plink = pid => `<a href="#/player/${pid}">${esc(pname(pid))}</a>`;
const tname = t => X.team.get(t)?.name ?? `Team ${t}`;
const hlink = hid => `<a href="#/dynasty/${hid}">${esc(D.houses[hid]?.n ?? "House " + hid)}</a>`;
const tlink = t => `<a href="#/dynasty/${X.team.get(t)?.house}">${esc(tname(t))}</a>`;
function result(yr, t) {
  if (t === yr.c) return "champ";
  if (t === yr.f) return "final";
  return yr.series.some(s => s[0] === t || s[1] === t) ? "playoff" : "out";
}
function rich(text) {                       // narration arrives as Markdown links to players/houses
  return esc(text).replace(/\[([^\]]+)\]\((players|houses)\/(\d+)\.md\)/g, (_, n, kind, id) =>
    `<a href="#/${kind === "players" ? "player" : "dynasty"}/${id}">${n}</a>`);
}
function seasonRow(pid, year) { return player(pid)?.s?.find(r => r[0] === year); }

/* ---------- routing ---------- */
function parseRoute() {
  const [, tab = "dynasty", arg] = location.hash.split("/");
  return { tab: ["dynasty", "season", "player", "players", "races", "records", "rivalries", "hof", "health"].includes(tab) ? tab : "dynasty", arg: arg === undefined || arg === "" ? null : +arg };
}
function route() {
  const app = $("#app");
  if (!D) { app.innerHTML = emptyState(); bindEmpty(); markTab(null); return; }
  const { tab, arg } = parseRoute();
  markTab(tab === "players" ? "player" : tab);
  let main = "", ctx;
  if (tab === "dynasty") { main = dynastyPage(arg); ctx = { title: arg ? `${D.houses[arg]?.n ?? "House"} timeline` : "League feed", events: arg ? X.evHouse.get(arg) ?? [] : D.events, auto: arg ? 1 : 2 }; }
  else if (tab === "season") {
    const y = X.year.has(arg) ? arg : D.meta.last_year;
    main = seasonPage(y); ctx = { title: `Year ${y}`, events: X.evYear.get(y) ?? [], auto: 1 };
  } else if (NEW[tab]) {
    main = NEW[tab].html(arg); ctx = NEW[tab].ctx(arg);
  } else {
    main = playersPage(arg); ctx = arg !== null && player(arg) ? { title: `${pname(arg)} timeline`, events: X.evPlayer.get(arg) ?? [], auto: 1 } : { title: "League feed", events: D.events, auto: 2 };
  }
  app.innerHTML = `<div class="layout"><main>${main}</main><aside class="feed card" id="feed"></aside></div>`;
  feed = { ...ctx, limit: 80 };
  renderFeed();
  bindPage(tab, arg);
  NEW[tab]?.bind?.(arg);
}
function markTab(t) { document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("on", a.dataset.tab === t)); }

/* ---------- feed ---------- */
let feed = null, feedFilter = { imp: "auto", kind: "" };
function renderFeed() {
  const min = feedFilter.imp === "auto" ? feed.auto : +feedFilter.imp;
  const evs = feed.events.filter(e => e.m >= min && (!feedFilter.kind || e.k === feedFilter.kind)).sort((a, b) => a.y - b.y || a.i - b.i);
  const shown = evs.slice(0, feed.limit);
  let lastY = null, items = "";
  for (const e of shown) {
    items += `<li class="m${e.m}"><span class="k">${esc(e.k.replace(/_/g, " "))} · ${IMP[e.m]}</span><a class="y" href="#/season/${e.y}">${fy(e.y)}</a> ${rich(e.t)}</li>`;
  }
  $("#feed").innerHTML = `<h2>${esc(feed.title)} <span class="muted" style="font-size:12px;text-transform:none">${evs.length} events</span></h2>
    <div class="filters"><select id="f-imp"><option value="auto">Auto importance</option><option value="3">Landmark only</option><option value="2">Major +</option><option value="1">Notable +</option></select>
    <select id="f-kind"><option value="">All kinds</option>${X.kinds.map(k => `<option value="${k}">${esc(k.replace(/_/g, " "))}</option>`).join("")}</select></div>
    <ul>${items || '<li class="muted">Nothing at this importance level.</li>'}${evs.length > shown.length ? `<li><button id="f-more">Show ${Math.min(80, evs.length - shown.length)} more</button></li>` : ""}</ul>`;
  $("#f-imp").value = feedFilter.imp; $("#f-kind").value = feedFilter.kind;
  $("#f-imp").onchange = e => { feedFilter.imp = e.target.value; feed.limit = 80; renderFeed(); };
  $("#f-kind").onchange = e => { feedFilter.kind = e.target.value; feed.limit = 80; renderFeed(); };
  $("#f-more")?.addEventListener("click", () => { const ul = $("#feed ul"), top = ul.scrollTop; feed.limit += 80; renderFeed(); $("#feed ul").scrollTop = top; });
}

/* ---------- dynasties tab ---------- */
function dynastyPage(selHouse) {
  const n = D.years.length, st = X.stats;
  const champs = new Set(D.years.map(y => y.c)).size, bestStreak = st.reduce((a, b) => (b.streak > a.streak ? b : a), st[0]);
  const mostTitles = st.reduce((a, b) => (b.titles.length > a.titles.length ? b : a), st[0]);
  let html = `<div class="stats">
    <div class="stat"><b>${n}</b><span>seasons</span></div>
    <div class="stat"><b>${champs} of ${D.teams.length}</b><span>teams that won a title</span></div>
    <div class="stat"><b>${mostTitles.titles.length}</b><span>most titles: ${esc(tname(mostTitles.t))}</span></div>
    <div class="stat"><b>${bestStreak.streak}</b><span>longest streak: ${esc(tname(bestStreak.t))}</span></div></div>`;
  const axis = D.years.map(y => `<i style="background:none;cursor:default;height:16px">${y.y % 10 === 0 ? `<span>${y.y}</span>` : ""}</i>`).join("");
  const rows = D.teams.map(t => {
    const s = st[t.id], h = D.houses[t.house];
    const cells = D.years.map(y => `<i class="res-${result(y, t.id)}" data-y="${y.y}" data-t="${t.id}"></i>`).join("");
    return `<div class="srow${selHouse === t.house ? " sel" : ""}"><div class="slabel"><span class="dot r${h?.r ?? 0}"></span><a href="#/dynasty/${t.house}">${esc(t.name)}</a> <small>${s.titles.length}</small></div><div class="cells" style="grid-template-columns:repeat(${n},minmax(5px,1fr))">${cells}</div></div>`;
  }).join("");
  html += `<div class="card"><h2>Every season at a glance</h2><div class="strip"><div class="strip-inner">${rows}
    <div class="srow"><div class="slabel"></div><div class="cells axis" style="grid-template-columns:repeat(${n},minmax(5px,1fr))">${axis}</div></div></div></div>
    <div class="legend"><span><i style="background:var(--gold)"></i>Champion</span><span><i style="background:var(--final)"></i>Finalist</span><span><i style="background:var(--playoff)"></i>Playoffs</span><span><i></i>Missed</span>

function valueChart(p) {

/* ---------- shared: charts and small widgets ---------- */
const CW = 640, CL = 46, CR = 12;
const CH = new Map(); let chN = 0, tipOwner = null;
const autoFmt = v => (Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1) : Math.abs(v) >= 1 ? v.toFixed(2) : v.toFixed(3));
const pctFmt = v => (100 * v).toFixed(0) + "%";
function chart(o) {
  const id = ++chN; CH.set(id, o);
  const H = o.h || 180, T = 8, B = 22, xs = o.xs, n = xs.length, fmt = o.fmt || autoFmt;
  const px = i => CL + (n > 1 ? i / (n - 1) : 0.5) * (CW - CL - CR);
  let lo = 0, hi = 1, stacks = null;
  if (o.kind === "area") {
    stacks = o.series.map((_, k) => xs.map((__, i) => o.series.slice(0, k + 1).reduce((a, s) => a + (s.data[i] ?? 0), 0)));
  } else {
    const vals = o.series.flatMap(s => s.data.filter(v => v != null)).concat((o.hlines ?? []).map(h => h.y));
    lo = o.yMin ?? Math.min(...vals, o.zero ? 0 : Infinity); hi = o.yMax ?? Math.max(...vals, o.zero ? 0 : -Infinity);
    if (!isFinite(lo) || !isFinite(hi)) { lo = 0; hi = 1; }
    if (hi === lo) { hi = lo + 1; }
    const floorZero = o.zero && lo >= 0;
    if (o.yMin == null && !floorZero) lo -= (hi - lo) * 0.06;
    if (o.yMax == null) hi += (hi - lo) * 0.06;
  }
  const y = v => T + (H - T - B) * (hi - v) / (hi - lo);
  let g = "";
  for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4; g += `<line class="grid" x1="${CL}" x2="${CW - CR}" y1="${y(v)}" y2="${y(v)}"/><text x="${CL - 5}" y="${y(v) + 3}" text-anchor="end">${fmt(v)}</text>`; }
  const step = Math.max(1, Math.floor((n - 1) / 6));
  for (let i = 0; i < n; i += step) g += `<text x="${px(i)}" y="${H - 6}" text-anchor="middle">${xs[i]}</text>`;
  if (o.kind === "area") {
    o.series.forEach((s, k) => {
      const top = xs.map((_, i) => `${px(i).toFixed(1)} ${y(stacks[k][i]).toFixed(1)}`);
      const bot = xs.map((_, i) => `${px(i).toFixed(1)} ${y(k ? stacks[k - 1][i] : 0).toFixed(1)}`).reverse();
      g += `<path d="M${top.join("L")}L${bot.join("L")}Z" fill="${s.color}" opacity=".85"/>`;
    });
  } else {
    for (const h of o.hlines ?? []) g += `<line class="ref" x1="${CL}" x2="${CW - CR}" y1="${y(h.y)}" y2="${y(h.y)}" stroke="${h.color || "var(--bad)"}"/><text x="${CW - CR}" y="${y(h.y) - 3}" text-anchor="end" style="fill:${h.color || "var(--bad)"}">${esc(h.label || "")}</text>`;
    for (const s of o.series) {
      let d = "", pen = false;
      s.data.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? "L" : "M"}${px(i).toFixed(1)} ${y(v).toFixed(1)}`; pen = true; });
      g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w || 1.8}"${s.dash ? ` stroke-dasharray="${s.dash}"` : ""} stroke-linejoin="round"/>`;
    }
  }
  g += `<line class="xh" y1="${T}" y2="${H - B}" stroke="var(--ink)" stroke-width="1" style="display:none"/>`;
  const lg = `<div class="lg">${o.series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`;
  return `${lg}<svg class="lchart" data-ch="${id}" viewBox="0 0 ${CW} ${H}">${g}</svg>`;
}
document.addEventListener("mousemove", e => {

      <div class="card"><h2>Top hybrid careers</h2><ul class="plist">` + [...hyb].sort((a, b) => b.p.cv - a.p.cv).slice(0, 12).map(e => `<li>${plink(e.id)}<span class="sub">${ancText(e.p)} · ${fl(e.p.cv, 0)}</span></li>`).join("") + `</ul></div></div>`;

const ancText = p => (p.an ? p.an.map((a, k) => (a >= 0.005 ? `${D.races[k]} ${Math.round(a * 100)}%` : null)).filter(Boolean).join(" · ") : "");

/* ---------- Record book ---------- */
let recScope = "all", recSel = null;

const TEAM_RECS = [["team_game", "team_pts", "max", "Most points in a game"], ["team_game", "team_pts", "min", "Fewest points in a game"], ["team_game", "team_margin", "max", "Largest margin of victory"],
  ["team_season", "wins", "max", "Most wins in a season"], ["team_season", "wins", "min", "Fewest wins in a season"], ["team_season", "mov", "max", "Best season margin"], ["team_season", "mov", "min", "Worst season margin"]];

function recProgress(key, cur, log, holder) {

/* ---------- Rivalry board ---------- */
let rvSel = null;

  html += `<div class="card"><h2>Rivalries ranked</h2><div class="lg">${Object.entries(RV_COL).map(([k, c]) => `<span><i style="background:${c}"></i>${k}</span>`).join("")}</div><div class="scroll"><table><tr><th class="l">Pair</th><th>Peak</th><th>Peak year</th><th>Now</th><th>Established</th><th class="l">What fuelled it</th></tr>` +

    <div class="card"><h2>Inbreeding in the living population</h2>${chart({ xs, series: [{ name: "Mean F", color: "var(--hyb)", data: H.f }], yMin: 0, fmt: v => v.toFixed(4) })}</div>
    <div class="card"><h2>Houses alive</h2>${chart({ xs, series: [{ name: "Houses alive", color: "var(--goliath)", data: H.houses }], zero: true, yMax: Math.max(...H.houses) + 1, fmt: v => v.toFixed(0) })}</div>
    <div class="card"><h2>Share of pro slots held by house-bred players</h2>${chart({ xs, series: [{ name: "House-bred share", color: "var(--human)", data: H.dyn }], fmt: pctFmt, yMin: 0, yMax: 1 })}</div></div>`;
  html += `<div class="card"><h2>League game metric</h2><select id="h-metric">${Object.keys(H.metrics).map(k => `<option value="${k}"${k === hMetric ? " selected" : ""}>${esc(METRIC_LABEL[k] ?? k)}</option>`).join("")}</select>` +
    chart({ xs, h: 190, series: [{ name: METRIC_LABEL[hMetric] ?? hMetric, color: "var(--accent)", data: H.metrics[hMetric] ?? [] }], fmt: FRAC.has(hMetric) ? v => (100 * v).toFixed(1) + "%" : undefined }) + `</div>`;
  html += `<div class="card"><h2>Trait drift</h2><select id="h-trait">${H.traits.map((t, i) => `<option value="${i}"${i === hTrait ? " selected" : ""}>${esc(t.replace(/_/g, " "))}</option>`).join("")}</select>
    <span class="muted" style="font-size:12px"> In SD units of the frozen year-0 reference; the alarm trips when a 20-season average moves more than ${Lm.mean_drift} SD (mean) or ${Lm.p99_drift} SD (99th percentile) over 50 seasons.</span>` +
    chart({ xs, h: 200, series: [{ name: "Pros, mean", color: "var(--accent)", data: H.mz.map(r => r[hTrait]) }, { name: "Population adults, mean", color: "var(--elf)", data: H.pz.map(r => r[hTrait]) }, { name: "Population, 99th percentile", color: "var(--gold)", data: H.p99.map(r => r[hTrait]), dash: "4 3" }], hlines: [{ y: 0, label: "", color: "var(--muted)" }] }) + `</div>`;
  const chunks = []; for (let i = 0; i < n; i += 10) chunks.push([i, Math.min(i + 10, n)]);
  const src = hPop === "pros" ? H.mz : H.pz;
  html += `<div class="card"><h2>Trait means by decade</h2>${pills([["pros", "Pros"], ["pop", "Population adults"]], hPop, "hp")}<div class="scroll"><table class="heat"><tr><th class="l">Trait</th>${chunks.map(([a, b]) => `<th>${xs[a]}–${xs[b - 1]}</th>`).join("")}</tr>` +
    H.traits.map((t, k) => `<tr><td>${esc(t.replace(/_/g, " "))}</td>${chunks.map(([a, b]) => { const v = mean(src.slice(a, b).map(r => r[k])); return `<td style="background:${heat(v)}">${v >= 0 ? "+" : ""}${v.toFixed(2)}</td>`; }).join("")}</tr>`).join("") + `</table></div>
    <div class="muted" style="font-size:12px;margin-top:6px">Mean in SD units of the frozen year-0 reference. Blue above it, orange below; a steady trend across columns is drift.</div></div>`;
  html += `<div class="card"><h2>Decade summary</h2><div class="scroll"><table><tr><th class="l">Seasons</th><th>Best-team margin</th><th>Win % spread</th><th>Title Gini</th><th>Mean inbreeding</th><th>House-bred share</th><th>Houses alive</th></tr>` +
    chunks.map(([a, b]) => { const tm = mean(H.top_mov.slice(a, b)), cnt = houses.map(h => H.champ_house.slice(a, b).filter(c => c === h).length);
      return `<tr><td class="l">${xs[a]}–${xs[b - 1]}</td><td class="${tm > Lm.top_mov ? "badtxt" : ""}">${tm.toFixed(1)}</td><td>${mean(H.win_sd.slice(a, b)).toFixed(3)}</td><td>${gini(cnt).toFixed(2)}</td><td>${mean(H.f.slice(a, b)).toFixed(4)}</td><td>${pctFmt(mean(H.dyn.slice(a, b)))}</td><td>${H.houses[b - 1]}</td></tr>`; }).join("") + `</table></div>
    <div class="muted" style="font-size:12px;margin-top:6px">Title Gini: 0 means titles shared evenly among houses, 1 means one house won everything in that decade.</div></div>`;
  return html;
}

/* ---------- page table for the new tabs ---------- */
const kinds = (...k) => D.events.filter(e => k.includes(e.k));
const NEW = {
  races: { html: racesPage, ctx: () => ({ title: "Prodigies and rare traits", events: kinds("prodigy", "trait_exposed"), auto: 1 }) },
  records: { html: recordsPage, ctx: () => ({ title: "Record breaks", events: kinds("record"), auto: 1 }),
    bind() { onPills("rs", v => { recScope = v; recSel = null; }); document.querySelectorAll("tr[data-rec]").forEach(r => r.addEventListener("click", () => { recSel = recSel === r.dataset.rec ? null : r.dataset.rec; rerender(); })); } },
  rivalries: { html: rivalriesPage, ctx: () => ({ title: "Rivalries established", events: kinds("rivalry"), auto: 1 }),
    bind() { document.querySelectorAll("[data-pair]").forEach(c => c.addEventListener("click", () => { rvSel = c.dataset.pair; rerender(); })); } },
  hof: { html: hofPage, ctx: () => ({ title: "Hall of Fame news", events: kinds("hof", "hof_builder"), auto: 1 }),
    bind() { onPills("hv", v => { hofView = v; }); onPills("hs", v => { hofScope = v; }); makeSortable(); } },
  health: { html: healthPage, ctx: () => ({ title: "Dynasty events", events: kinds("extinction", "succession_effect", "drought_ended", "outlier", "succession", "adoption", "heir_death"), auto: 2 }),
    bind() { $("#h-metric")?.addEventListener("change", e => { hMetric = e.target.value; rerender(); }); $("#h-trait")?.addEventListener("change", e => { hTrait = +e.target.value; rerender(); }); onPills("hp", v => { hPop = v; }); } },
};
function makeSortable() {
  document.querySelectorAll("table.sortable").forEach(t => {
    t.querySelectorAll("th.sortable").forEach(th => th.addEventListener("click", () => {
      const c = +th.dataset.c, dir = th.dataset.dir === "desc" ? 1 : -1, rows = [...t.querySelectorAll("tr")].slice(1);
      t.querySelectorAll("th").forEach(x => delete x.dataset.dir); th.dataset.dir = dir === -1 ? "desc" : "asc";
      const v = r => { const x = r.children[c].dataset.v, num = parseFloat(x); return isNaN(num) || /[a-z]/i.test(x) ? x : num; };
      rows.sort((a, b) => { const x = v(a), y = v(b); return dir * (typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y))); }).forEach(r => t.appendChild(r));
    }));
  });
}

/* ---------- page bindings ---------- */
function bindPage(tab, arg) {
  if (tab === "dynasty") {
    const strip = $(".strip");
    strip?.addEventListener("click", e => { const c = e.target.closest("i[data-y]"); if (c) location.hash = `#/season/${c.dataset.y}`; });
    strip?.addEventListener("mousemove", e => {
      const c = e.target.closest("i[data-y]"), tip = $("#tip");
      if (!c) { tip.style.display = "none"; return; }
      const yr = X.year.get(+c.dataset.y), t = +c.dataset.t, r = result(yr, t);
      tip.innerHTML = `<b>${esc(tname(t))}</b><br>Year ${yr.y}: ${yr.w[t]}–${yr.l[t]}, MOV ${yr.mov[t] > 0 ? "+" : ""}${fl(yr.mov[t])}<br>${RES_LABEL[r]}`;
      tip.style.display = "block"; tip.style.left = Math.min(e.clientX + 14, innerWidth - 270) + "px"; tip.style.top = e.clientY + 14 + "px";
    });
    strip?.addEventListener("mouseleave", () => ($("#tip").style.display = "none"));
  } else if (tab === "season") {
    const y = X.year.has(arg) ? arg : D.meta.last_year;
    $("#prev")?.addEventListener("click", () => stepYear(-1));
    $("#next")?.addEventListener("click", () => stepYear(1));
    $("#yslider")?.addEventListener("input", e => { location.hash = `#/season/${e.target.value}`; });
    if (!X.year.has(arg)) history.replaceState(null, "", `#/season/${y}`);
  } else {
    const s = $("#psearch");
    s?.addEventListener("input", e => { pq = e.target.value; if (arg !== null && player(arg)) location.hash = "#/players"; else renderPlayerLists(); });
    if (!(arg !== null && player(arg))) renderPlayerLists();
  }
}
function stepYear(d) {
  const { tab, arg } = parseRoute(), y = X.year.has(arg) ? arg : D.meta.last_year, i = D.years.findIndex(r => r.y === y) + d;
  if (i >= 0 && i < D.years.length) location.hash = `#/season/${D.years[i].y}`;
}
addEventListener("keydown", e => {
  if (!D || parseRoute().tab !== "season" || /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName) && document.activeElement.type !== "range") return;
  if (e.key === "ArrowLeft") stepYear(-1); else if (e.key === "ArrowRight") stepYear(1);
});
addEventListener("hashchange", () => D && route());

/* ---------- empty state, new run, saved runs ---------- */
function emptyState() {
  return `<div class="card empty"><h2>No run loaded</h2><p class="muted">Open a saved run (a <code>viewer.json</code> written by a simulation) or start a fresh one.</p>
    <div class="row"><button id="e-load">Load a saved run…</button><button id="e-new" class="primary">Start a new run…</button></div>
    <p class="muted" style="margin-top:22px">Tip: you can also drag a <code>viewer.json</code> onto this page.</p></div>`;
}
function bindEmpty() { $("#e-load")?.addEventListener("click", () => $("#file").click()); $("#e-new")?.addEventListener("click", openNew); }

function openNew() {
  const body = $("#newbody");
  if (!SERVER) {
    body.innerHTML = `<p>A static page can't run the simulation. Start the local launcher, which opens this same page with a <b>New run</b> form:</p>
      <pre>python -m dynasty_sim.cli view</pre><p class="muted">Or write a run to disk and load its <code>viewer.json</code> here:</p>
      <pre>python -m dynasty_sim.cli run --years 50 --seed 3 --out runs/demo</pre>
      <div class="row"><button id="n-close">Close</button></div>`;
  } else {
    body.innerHTML = `<form id="nform"><label>Seed (same seed, same history)</label><input type="number" name="seed" min="0" max="4294967295" value="${Math.floor(Math.random() * 10000)}" required>
      <label>Seasons to simulate (1–300)</label><input type="number" name="years" min="1" max="300" value="50" required>
      <label>Teams</label><select name="teams"><option>4</option><option selected>8</option></select>
      <p class="muted" style="font-size:12px">About 30 s for 50 seasons (8 teams); the first run after install spends about a minute compiling the engine.</p>
      <div class="err" id="nerr"></div><div class="row"><button type="button" id="n-close">Cancel</button><button class="primary" type="submit">Start</button></div></form>`;
    $("#nform").onsubmit = async e => {
      e.preventDefault();
      const f = new FormData(e.target), payload = { seed: +f.get("seed"), years: +f.get("years"), teams: +f.get("teams") };
      const r = await fetch("/api/new", { method: "POST", body: JSON.stringify(payload) }), j = await r.json();
      if (!r.ok) { $("#nerr").textContent = j.error; return; }
      $("#newdlg").close(); pollJob();
    };
  }
  $("#n-close").onclick = () => $("#newdlg").close();
  $("#newdlg").showModal();
}
async function pollJob() {
  clearTimeout(jobTimer);
  const pill = $("#jobpill");
  let j;
  try { j = await (await fetch("/api/job")).json(); } catch { return; }
  if (j.state === "running") {
    pill.style.display = "inline-block"; pill.textContent = j.done ? `Simulating seed ${j.seed}: season ${j.done} of ${j.total}` : `Seed ${j.seed}: starting (compiling the engine on first run)…`;
    jobTimer = setTimeout(pollJob, 800);
  } else if (j.state === "done") {
    pill.style.display = "none"; await refreshSaved(j.path); await loadSaved(j.path);
  } else if (j.state === "error") {
    pill.style.display = "inline-block"; pill.textContent = "Run failed: " + j.error;
  }
}
async function loadSaved(path) {
  try {
    const r = await fetch("/api/run?path=" + encodeURIComponent(path));
    if (!r.ok) throw new Error("Could not read that run.");
    init(await r.json()); location.hash = "#/dynasty"; $("#saved").value = path;
  } catch (e) { toast(e.message); }
}
async function refreshSaved(select) {
  const j = await (await fetch("/api/runs")).json(), sel = $("#saved");
  sel.innerHTML = `<option value="">Saved runs (${j.runs.length})…</option>` + j.runs.map(r => `<option value="${esc(r.path)}">${esc(r.label)} — seed ${r.seed}, ${r.years}y, ${r.teams} teams</option>`).join("");
  sel.style.display = "";
  if (select) sel.value = select;
  return j;
}

/* ---------- boot ---------- */
$("#btn-load").onclick = () => $("#file").click();
$("#file").onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0]); e.target.value = ""; };
$("#btn-new").onclick = openNew;
$("#saved").onchange = e => e.target.value && loadSaved(e.target.value);
addEventListener("dragover", e => { e.preventDefault(); $("#drop").style.display = "flex"; });
addEventListener("dragleave", e => { if (!e.relatedTarget) $("#drop").style.display = "none"; });
addEventListener("drop", e => { e.preventDefault(); $("#drop").style.display = "none"; if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });
(async function boot() {
  if (EMBEDDED) { try { init(EMBEDDED); } catch (e) { route(); toast(e.message); } } else route();
  if (location.protocol.startsWith("http")) {
    try {
      const j = await refreshSaved();
      SERVER = true;
      if (!EMBEDDED && j.current) await loadSaved(j.current);
      pollJob();
    } catch { SERVER = false; }
  }
})();
</script>
</body>
</html>
